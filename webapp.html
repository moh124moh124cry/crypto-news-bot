<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto News</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#0f1115);
 --fg:var(--tg-theme-text-color,#f2f2f2);--card:var(--tg-theme-secondary-bg-color,#1b1f27);
 --accent:var(--tg-theme-button-color,#2481cc);--muted:#8a93a3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:17px;font-weight:700}
.flags{display:flex;gap:4px}
.flag{background:none;border:1px solid transparent;border-radius:10px;
 font-size:19px;padding:3px 5px;cursor:pointer;line-height:1;opacity:.5}
.flag.on{opacity:1;border-color:var(--accent);background:rgba(36,129,204,.12)}
.clock{margin:0 16px 12px;padding:12px 14px;border-radius:14px;background:var(--card);
 display:flex;align-items:center;justify-content:space-between;gap:8px}
.time{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.date{font-size:13px;color:var(--muted);text-align:end}
.tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;border:none;font-size:14px;
 background:var(--card);color:inherit;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;font-weight:600}
.card{display:block;margin:0 16px 10px;padding:12px 14px;border-radius:14px;
 background:var(--card);text-decoration:none;color:inherit}
.card h3{margin:0 0 8px;font-size:15px;line-height:1.45;font-weight:600}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(36,129,204,.18);
 color:var(--accent);font-weight:600}
.state{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px}
footer{padding:6px 16px 26px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>
<body>

<div class="top">
  <div class="title" id="appTitle">🪙 أخبار الكريبتو</div>
  <div class="flags" id="flags"></div>
</div>

<div class="clock">
  <div class="time" id="time">--:--:--</div>
  <div class="date" id="date">—</div>
</div>

<div class="tabs" id="tabs"></div>
<div id="list"><div class="state" id="state">…</div></div>
<footer id="foot"></footer>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const I18N = {
  ar:{code:"ar-DZ",dir:"rtl",title:"🪙 أخبار الكريبتو",all:"الكل",mining:"⛏️ التعدين",
      trading:"📈 التداول",x:"🐦 X",yt:"▶️ يوتيوب",loading:"جارٍ التحميل…",empty:"لا توجد أخبار حاليًا",
      error:"تعذّر تحميل الأخبار",updated:"آخر تحديث"},
  en:{code:"en-GB",dir:"ltr",title:"🪙 Crypto News",all:"All",mining:"⛏️ Mining",
      trading:"📈 Trading",x:"🐦 X",yt:"▶️ YouTube",loading:"Loading…",empty:"No news right now",
      error:"Failed to load news",updated:"Last update"},
  fr:{code:"fr-FR",dir:"ltr",title:"🪙 Actus Crypto",all:"Tout",mining:"⛏️ Minage",
      trading:"📈 Trading",x:"🐦 X",yt:"▶️ YouTube",loading:"Chargement…",empty:"Aucune actualité",
      error:"Échec du chargement",updated:"Dernière mise à jour"},
  de:{code:"de-DE",dir:"ltr",title:"🪙 Krypto-News",all:"Alle",mining:"⛏️ Mining",
      trading:"📈 Trading",x:"🐦 X",yt:"▶️ YouTube",loading:"Wird geladen…",empty:"Keine News",
      error:"Laden fehlgeschlagen",updated:"Letzte Aktualisierung"},
  es:{code:"es-ES",dir:"ltr",title:"🪙 Noticias Cripto",all:"Todo",mining:"⛏️ Minería",
      trading:"📈 Trading",x:"🐦 X",yt:"▶️ YouTube",loading:"Cargando…",empty:"Sin noticias",
      error:"Error al cargar",updated:"Última actualización"}
};
const FLAGS = {ar:"🇸🇦", en:"🇬🇧", fr:"🇫🇷", de:"🇩🇪", es:"🇪🇸"};

const params = new URLSearchParams(location.search);
let lang = params.get("lang")
        || localStorage.getItem("lang")
        || (tg?.initDataUnsafe?.user?.language_code || "ar").slice(0,2);
if (!I18N[lang]) lang = "ar";
let filter = {key:"all"};

/* ---------- الساعة والتاريخ (تلقائي) ---------- */
function tickClock(){
  const now = new Date(), L = I18N[lang].code;
  document.getElementById("time").textContent =
    now.toLocaleTimeString(L, {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false});
  document.getElementById("date").textContent =
    now.toLocaleDateString(L, {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(tickClock, 1000);

/* ---------- الواجهة ---------- */
function buildFlags(){
  document.getElementById("flags").innerHTML = Object.keys(FLAGS).map(l =>
    `<button class="flag ${l===lang?"on":""}" data-l="${l}" title="${l}">${FLAGS[l]}</button>`
  ).join("");
  document.querySelectorAll(".flag").forEach(b => b.onclick = () => {
    lang = b.dataset.l;
    localStorage.setItem("lang", lang);
    tg?.HapticFeedback?.selectionChanged();
    applyLang();
  });
}

function buildTabs(){
  const T = I18N[lang];
  const defs = [["all",T.all],["mining",T.mining],["trading",T.trading],
                ["x",T.x],["yt",T.yt]];
  document.getElementById("tabs").innerHTML = defs.map(([k,label]) =>
    `<button class="tab ${k===filter.key?"on":""}" data-k="${k}">${label}</button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    filter = {key:b.dataset.k};
    buildTabs(); load();
  });
}

function applyLang(){
  const T = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = T.dir;
  document.getElementById("appTitle").textContent = T.title;
  buildFlags(); buildTabs(); tickClock(); load();
}

/* ---------- تحميل الأخبار ---------- */
async function load(){
  const T = I18N[lang], list = document.getElementById("list");
  list.innerHTML = `<div class="state">${T.loading}</div>`;
  const q = new URLSearchParams({lang});
  if (filter.key === "x" || filter.key === "yt") q.set("origin", filter.key);
  else if (filter.key !== "all") q.set("category", filter.key);
  try {
    const res = await fetch("/api/news?" + q.toString(), {cache:"no-store"});
    const data = await res.json();
    const items = data.items || [];
    if (!items.length){ list.innerHTML = `<div class="state">${T.empty}</div>`; return; }
    list.innerHTML = items.map(n => `
      <a class="card" href="${n.link}" target="_blank" rel="noopener">
        <h3>${n.origin === "x" ? "🐦 " : n.origin === "yt" ? "▶️ " : ""}${escapeHtml(n.title)}</h3>
        <div class="meta">
          <span>${escapeHtml(n.source)}</span>
          <span class="badge">${T[n.category] || n.category}</span>
        </div>
      </a>`).join("");
    document.getElementById("foot").textContent =
      T.updated + ": " + new Date().toLocaleTimeString(T.code);
  } catch(e){
    list.innerHTML = `<div class="state">${T.error}</div>`;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- تتبّع الاستخدام: عدد المستخدمين ومدة الجلسة ---------- */
const U = tg?.initDataUnsafe?.user || {};
const SID = (U.id || "anon") + "-" + Date.now();
const T0 = Date.now();

function track(event){
  const payload = JSON.stringify({
    sid: SID, event,
    user_id: String(U.id || "anon"),
    username: U.username || "",
    lang: lang,
    seconds: Math.round((Date.now() - T0) / 1000)
  });
  try {
    if (event === "end" && navigator.sendBeacon) {
      navigator.sendBeacon("/api/track",
        new Blob([payload], {type: "application/json"}));
    } else {
      fetch("/api/track", {method: "POST", keepalive: true,
        headers: {"Content-Type": "application/json"}, body: payload});
    }
  } catch(e){}
}

track("start");
setInterval(() => track("ping"), 15000);          // نبضة كل 15 ثانية
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") track("end");
});
window.addEventListener("pagehide", () => track("end"));

applyLang();
setInterval(load, 60000);   // تحديث لحظي كل دقيقة
</script>
</body>
</html>
